# run-scraper.yml
#
# Makes "refreshes on its own" true, using GitHub Actions' cron scheduler.
#
# WHAT CHANGED FROM THE ORIGINAL VERSION OF THIS FILE
# ---------------------------------------------------
# It used to run `run_all_states.py` on a flat daily cron: fetch everything,
# every day, forever. That was wrong in both directions — it re-read affidavits
# that hadn't changed since nomination day, while still being too coarse to
# catch a withdrawal two days before a poll.
#
# It now runs the two-stage pipeline instead:
#
#   1. calendar_discovery.py  — one request per state index page. That page
#      labels every seat with its polling date, including by-elections
#      ("BANKIPUR : BYE ELECTION ON 30-07-2026"), so ~30 requests discover
#      every live election in India. This replaces scraping eci.gov.in, which
#      returns 403 to automated requests (verified, browser UA included).
#
#   2. halka_refresh.py — ranks work by urgency x volatility x gap and spends a
#      hard request budget on the highest-value fetches only. A seat that voted
#      last year scores near zero and is skipped; a seat polling in four days
#      with an unparsed criminal-case count goes first.
#
# The cost difference is the entire point: discovering that nothing changed
# nationally costs ~30 requests. Blindly re-scraping every seat costs ~100,000.
#
# TWO CADENCES, NOT ONE
# ---------------------
# Discovery is cheap, so it runs daily — that's what catches a by-poll being
# announced. Ingestion is expensive, so it runs only when the policy layer says
# a seat is worth fetching. Both jobs are in this one file; the policy layer
# decides whether the second one actually does anything.
#
# STATUS: schedule turned ON 2026-07-27, after the ADR permission email was
# sent (no reply yet — see the note further down by the cron line for the
# reasoning). Runs daily at 03:00 UTC / ~08:30 IST.
#
# CONDITIONS THIS RELIED ON
# --------------------------
# - robots.txt: checked live. Only disallows *printer=true / *print=true —
#   it does not block the candidate-list or candidate-detail URLs used here.
# - ADR's terms (FAQ, checked live): data is free for non-commercial use, and
#   their FAQ invites direct contact for research use (adr@adrindia.org).
#   ADR-permission-email-DRAFT.md in this repo was sent 2026-07-27. No reply
#   yet — the schedule below was turned on anyway, on the reasoning that
#   ADR's own published non-commercial terms are sufficient in the meantime,
#   combined with the fact that this pipeline only fetches during an active
#   election window for the affected seats rather than polling everything
#   daily (see the refresh-cadence reasoning in halka_refresh.py). If ADR
#   replies with a different ask — a rate limit, a preferred access path, an
#   objection — that reply overrides this schedule; update or disable it then.
# - Note the ask is smaller than it used to be: this pipeline only fetches
#   candidate data during an active election window for the affected seats,
#   rather than polling everything daily. That is a much easier thing to
#   describe honestly to ADR.

name: Halka data refresh (calendar-driven)

on:
  schedule:
    # Daily at 03:00 UTC (~08:30 IST). Discovery runs every time; ingestion
    # runs only for seats the policy layer scores as worth fetching, so most
    # days this costs ~30 requests and writes nothing.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      budget:
        description: 'Max HTTP requests for the ingestion stage'
        required: false
        default: '200'
      dry_run:
        description: 'Plan only, fetch nothing (true/false)'
        required: false
        default: 'false'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      # Offline self-tests. If the parser has drifted from MyNeta's real markup,
      # fail here rather than writing a run's worth of malformed candidate
      # records into the repo and serving them to voters.
      - name: Run self-tests (no network)
        run: |
          python myneta_scraper.py
          python refresh_policy.py
          python promise_taxonomy.py
          python calendar_discovery.py --self-test
          python halka_refresh.py --self-test

      # Stage 1 — cheap. One request per state, discovers every live election.
      - name: Discover the election calendar
        run: |
          python calendar_discovery.py \
            --states Bihar2025 MadhyaPradesh2023 Gujarat2022 \
            --delay 3.0 --out election_calendar.json

      # Stage 2 — expensive, and budgeted. Human-verified calendar entries in
      # election_calendar_curated.json take precedence over discovered ones.
      - name: Refresh candidate data (budgeted, priority-ordered)
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python halka_refresh.py --budget "${{ github.event.inputs.budget || 200 }}"
          else
            python halka_refresh.py --execute --budget "${{ github.event.inputs.budget || 200 }}" --delay 3.0
          fi

      # Rebuild the frontend so the app reflects whatever was just fetched.
      - name: Rebuild the app
        run: python build_app.py

      - name: Commit updated data, if anything changed
        run: |
          git config user.name "halka-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ election_calendar.json refresh_state.json halka-app.html
          git diff --cached --quiet && echo "No changes this run." && exit 0
          git commit -m "Data refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
